name: constraints-parity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install pinned CUE
        run: ./tools/install-cue.sh

      - name: Validate CUE source syntax (cue vet)
        run: make cue-vet

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recompile every constraint to every target
        run: tools/compile_all.sh

      - name: Codegen drift gate (canonical Rust tree must match)
        run: python3 tools/codegen_drift_audit.py

      # Runs after `tools/compile_all.sh` because every module below reads
      # `compiled/`, which is gitignored and regenerated by that step.
      # `test_semantic_carriers` is the only gate that catches a meaning-level
      # regression a conforming document can carry — an `xsd:date` that comes
      # back as a plain string passes `ci_validate` with zero violations.
      - name: Contract unit suites (compile parity, semantics, and release records)
        run: |
          # Delegated to the Makefile on purpose. This list used to be
          # duplicated here, and the copies drifted: CI kept invoking three
          # modules that had been deleted, and never gained the two that
          # replaced them, so CI and `make` were running different suites.
          make test-audits PYTHON=python3

      - name: SHACL Pattern-C lint (no sh:if/sh:then in compiled output)
        run: |
          if grep -rE 'sh:(if|then)' compiled/shacl/; then
            echo 'compiled SHACL contains forbidden sh:if/sh:then; Pattern C only.' >&2
            exit 1
          fi

      - name: Cross-target parity (CORE Vocabulary fixtures must agree)
        run: python3 tools/constraints_parity.py

      - name: Vocab audit (every term has a fixture)
        run: python3 tools/vocab_audit.py

      - name: L0-L3 coverage audit
        run: python3 tools/l0_l3_coverage_audit.py

      - name: Negative-fixture audit (every -negative.jsonld FAILS as designed)
        run: python3 tools/validate_negatives.py

      - name: Rename audit (no pkaf:/PKAF strings introduced)
        run: python3 tools/rename_audit.py

      - name: L4 behavior coverage audit
        run: python3 tools/l4_coverage_audit.py

      - name: Version sync check (VERSION ↔ Cargo.toml ↔ jsonld context)
        run: python3 tools/version_sync.py --check

      - name: v0.2 SHACL positive-fixture suite
        run: python3 tools/ci_validate.py

      - name: Build all crates (Layer 4 projectors + Layer 5 rkaf-runtime-cli)
        run: cargo build --manifest-path crates/Cargo.toml --workspace

      - name: Layer 4 projector unit tests (Attach/Extract/RoundTrip per crate)
        run: cargo test --manifest-path crates/Cargo.toml --workspace

      - name: Layer 4 projector parity (round-trip fixtures across all targets)
        run: python3 tools/projector_parity.py

      - name: Conformance report (L1/L2/L3 per fixture, exits 1 on divergence)
        run: python3 tools/conformance_report.py
