[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rulespec-conformance"
# Propagated from VERSION by tools/version_sync.py. PEP 440 normalises
# `0.2.0-pre.9` to `0.2.0rc9`, so no translation is needed.
version = "0.2.0-pre.9"
description = "Rulespec conformance validator: SHACL suite, compiled schemas, and the CI gate that applies them."
readme = "README.md"
requires-python = ">=3.12"
# Dual, and not yet settled. The wheel carries code (LICENSE-CODE) alongside
# shapes, context and fixtures (LICENSE-SPEC); declaring one SPDX identifier
# would misstate the terms of the data it ships. Both files are placeholders —
# fix this before publishing anywhere.
license = { text = "See LICENSE, LICENSE-CODE, and LICENSE-SPEC (dual, placeholders)" }

dependencies = [
    "pyshacl>=0.31.0",
    "rdflib>=7.0.0",
    # 86/86 RDFC-1.0; 1.0.0 requires Python 3.12, matching the CI job.
    "rdfcanon==1.0.0",
    # The SourceCatalogRelease verifier applies Draft 2020-12 schemas. It was
    # already a tooling requirement; shipping the verifier makes it a
    # distribution requirement too. No canonicalization dependency joins it:
    # the release records use the stdlib canonical JSON of
    # `spec/rulespec-releases.md` §1, which equals RFC 8785 on the safe value
    # domain those records are restricted to.
    "jsonschema>=4.23.0",
]

[project.scripts]
rulespec-ci-validate = "rulespec_conformance.ci_validate:main"
# Separate from `rulespec-ci-validate` on purpose — see the module docstring:
# the sealed M2 RulespecCoreRelease pins `ci_validate.py`'s bytes, so folding
# this gate in there would couple two independently digested release surfaces.
rulespec-source-catalog-validate = "rulespec_conformance.source_catalog_validate:main"
# Third script, same reason: each release surface carries its own digest, so a
# gate folded into another surface's validator would move that surface's identity.
rulespec-document-validate = "rulespec_conformance.document_validate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rulespec_conformance"]

# The validator's data enters the wheel here rather than being copied into the
# source tree. The layout under `_data/` mirrors the repository's because 517
# fixtures resolve the context by relative path — 114 at `../`, 403 at `../../`
# — so both depths have to land where they already point.
#
# `compiled/` is generated and gitignored, so this table is also the gate that
# a wheel is only buildable from a compiled tree: hatchling fails the build
# outright when a force-include source is missing. Do not soften that.
[tool.hatch.build.targets.wheel.force-include]
"compiled" = "rulespec_conformance/_data/compiled"
"shapes" = "rulespec_conformance/_data/shapes"
"fixtures" = "rulespec_conformance/_data/fixtures"
"context/rkaf-context.jsonld" = "rulespec_conformance/_data/context/rkaf-context.jsonld"
# The SourceCatalogRelease v1 candidate: schema bytes, sealed valid and invalid
# fixture bundles, and the RulespecCoreRelease manifest whose `release_id` is
# the bundle digest. Named file by file rather than shipping all of
# `release-records/`, so the wheel carries what the packaged verifier reads and
# nothing else. `rulespec-core-release.schema.json` rides along because it is
# the closed shape gate for that manifest.
"release-records/schemas/source-catalog-release-v1.schema.json" = "rulespec_conformance/_data/release-records/schemas/source-catalog-release-v1.schema.json"
"release-records/schemas/source-catalog-release-v1" = "rulespec_conformance/_data/release-records/schemas/source-catalog-release-v1"
"release-records/schemas/rulespec-core-release.schema.json" = "rulespec_conformance/_data/release-records/schemas/rulespec-core-release.schema.json"
"release-records/fixtures/source-catalog-release-v1" = "rulespec_conformance/_data/release-records/fixtures/source-catalog-release-v1"
"release-records/source-catalog-release-v1-candidate.json" = "rulespec_conformance/_data/release-records/source-catalog-release-v1-candidate.json"
# The DocumentRelease v2 candidate, the same way.
"release-records/schemas/document-release-v2.schema.json" = "rulespec_conformance/_data/release-records/schemas/document-release-v2.schema.json"
"release-records/schemas/document-release-v2" = "rulespec_conformance/_data/release-records/schemas/document-release-v2"
"release-records/fixtures/document-release-v2" = "rulespec_conformance/_data/release-records/fixtures/document-release-v2"
"release-records/document-release-v2-candidate.json" = "rulespec_conformance/_data/release-records/document-release-v2-candidate.json"
# The terms travel with the data they govern.
"LICENSE" = "rulespec_conformance/_data/LICENSE"
"LICENSE-CODE" = "rulespec_conformance/_data/LICENSE-CODE"
"LICENSE-SPEC" = "rulespec_conformance/_data/LICENSE-SPEC"

# No sdist target: an sdist cannot carry `compiled/` (gitignored, and a source
# distribution that ships generated output is not a source distribution), so
# building from one would fail at the force-include above. Wheel only.
